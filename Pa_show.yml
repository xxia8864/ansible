---

- name: run cli command on active PAN-OS firewall
  hosts: "{{ target | default('ha_pair') }}"
  connection: local
  gather_facts: false

  tasks:
    - name: run commands on the active firewall
      paloaltonetworks.panos.panos_op:
        provider:
          ip_address: "{{ active_fw }}"
          username: "{{ username | default(omit) }}"
          password: "{{ password | default(omit) }}"
        cmd: "{{ item }}"
      loop: "{{ cli_cmd }}"
      register: cli_outputs

    - name: Send output email
      mail:
        host: "{{ alert_smtp_host }}"
        from: "{{ alert_email_from }}"
        to: "{{ alert_email_to }}"
        subject: "PAN-OS show output - {{ inventory_hostname }} ({{ active_fw }})"
        body: |
          HA pair: {{ inventory_hostname }}
          Active firewall: {{ active_fw }}
          {% for result in cli_outputs.results %}

          ----------------------------------------
          Command {{ loop.index }}: {{ result.item }}
          ----------------------------------------
          {# stdout is the XML response converted to JSON; render it as YAML #}
          {% set data = (result.stdout | from_json).response.result | default('', true) %}
          {% if data is string %}
          {{ data | trim }}
          {% else %}
          {{ data | to_nice_yaml(indent=2, width=200) }}
          {% endif %}
          {% endfor %}
      delegate_to: localhost
