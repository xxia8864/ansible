---
# Run show commands on both PAN-OS firewalls of each HA pair over SSH.
#
# PAN-OS has no network_cli plugin and does not accept "ssh host <cmd>",
# so we drive an interactive SSH session with the expect module:
# wait for the CLI prompt, send one command, wait for the prompt again, ...
#
# Inventory host vars (one host per HA pair):
#   primary_ip_address, secondary_ip_address, username, password
# Extra vars:
#   cli_cmd:
#     - show system info
#     - show high-availability state

- name: run cli command on PAN-OS firewalls (SSH)
  hosts: "{{ target  }}"
  gather_facts: no
  connection: local

  vars:
    # PAN-OS prompt, e.g. "admin@fw01(active)> "
    panos_prompt: '\S+@\S+> '
    panos_cmd_timeout: 120

  pre_tasks:
# name: Generate timestamp once
    - import_tasks: tasks/t_time_stamp.yml

    - name: set file name
      set_fact:
        filename: "pa_show_output_{{ timestamp_sec }}.txt"
      delegate_to: localhost
      run_once: true

    - name: create tmp folder
      file:
        path: /tmp/tmpfiles
        state: directory
      delegate_to: localhost
      run_once: true

    - name: create output file locally
      copy:
        content: |
          =================================================
          PAN-OS Command Output Report
          Generated: {{ timestamp_day }} - {{ timestamp_sec }}
          Total HA pairs: {{ ansible_play_hosts | length }}
          =================================================
        dest: "/tmp/tmpfiles/{{ filename }}"
      run_once: true
      delegate_to: localhost

  tasks:
    - name: run commands on PAN-OS firewalls via ssh
      expect:
        command: >-
          ssh -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PubkeyAuthentication=no
          {{ username }}@{{ item }}
        responses:
          '(?i)password:': "{{ password }}"
          # each time the prompt shows up, send the next line
          '{{ panos_prompt }}': "{{ ['set cli pager off'] + cli_cmd + ['exit'] }}"
        timeout: "{{ panos_cmd_timeout }}"
      loop:
        - "{{ primary_ip_address }}"
        - "{{ secondary_ip_address }}"
      register: cli_outputs
      no_log: true
      delegate_to: localhost

    - name: create host temporary output file
      copy:
        content: |

          HA pair: {{ inventory_hostname }}
          {% for result in cli_outputs.results %}

          ----------------------------------------
          Firewall: {{ result.item }}
          ----------------------------------------
          {{ result.stdout | replace('\r', '') }}
          {% endfor %}
          =================================================
        dest: "/tmp/tmpfiles/{{ filename }}-{{ inventory_hostname }}.txt"
      delegate_to: localhost

    - name: merge host temporary files into final report
      shell: |
        cat /tmp/tmpfiles/{{ filename }}-* >> /tmp/tmpfiles/{{ filename }}
      delegate_to: localhost
      run_once: true

# add SFTP server to inventory
    - import_tasks: tasks/t_sftp.yml
      delegate_to: localhost
      run_once: true

# upload report file to SFTP server
    - import_tasks: tasks/t_upload.yml
      delegate_to: sftp_target
      run_once: true

  post_tasks:
# delete tmp files
    - import_tasks: tasks/t_delete_file.yml
      delegate_to: localhost
      run_once: true
      no_log: false

    - import_tasks: tasks/t_delete_file.yml
      vars:
        files_to_delete:
          - "{{ filename }}-{{ inventory_hostname }}.txt"
      delegate_to: localhost
      no_log: false
