---
# PA_dp_cpu.yml
# ============================================================
# Monitor PAN-OS firewall data plane CPU: "CPU load sampling by group"
# (show running resource-monitor) via the PAN-OS XML API (HTTPS, connection: local).
#
# An alert email is sent when ANY of the following occurs:
#   - Any group in "CPU load sampling by group" EXCEEDS cpu_group_threshold (%)
#   - The PAN-OS XML API call fails, or the group values cannot be found in the output
#
# The whole API output is saved as a .txt file on every run and uploaded to SFTP
# (<sftp_path>/<YYYYMMDD>/<host>-<role>-DPCPU-<HHMMSS>.txt).
#
# Note: the group values are a single per-second snapshot taken when the API is called.
#
# Required AWX credential / extra-vars (never hardcoded here):
#   panos_api_key    - PAN-OS XML API key
#   alert_email_to   - Alert recipient address
#   alert_email_from - Alert sender address
#   alert_smtp_host  - SMTP relay hostname
#   sftp_host, sftp_username, sftp_password, sftp_path - used by tasks/t_sftp.yml and tasks/t_upload.yml
# ============================================================

- name: Monitor PAN-OS firewall data plane CPU by group
  hosts: all
  gather_facts: false
  connection: local

  vars:
    # ---- Alert threshold (edit here to tune sensitivity) ----
    cpu_group_threshold: 80   # %  – alert if ANY group is ABOVE this
  pre_tasks:

  - import_tasks: tasks/t_time_stamp.yml
  - name: Check HA state via XML API
    uri:
      url: "https://{{ inventory_hostname }}/api/"
      method: POST
      validate_certs: false
      headers:
        X-PAN-KEY: "{{ panos_api_key }}"
      body_format: form-urlencoded
      body:
        type: "op"
        cmd: "<show><high-availability><state/></high-availability></show>"
      return_content: true
    register: ha_response
    no_log: true

  - name: Extract HA state
    set_fact:
      ha_state: >-
        {{ ha_response.content | regex_search('<state>(.*?)</state>', '\1') | first | default('unknown') }}

#  - name: Stop if firewall is not active
#    meta: end_host
#    when: ha_state != 'active'

  tasks:

    # -------------------------------------------------------------------------
    # Initialise every fact that later tasks may reference conditionally.
    # -------------------------------------------------------------------------
    - name: Initialise alert facts with safe defaults
      set_fact:
        alert_triggered: false
        api_failed: false
        parse_failed: false
        group_pairs: []
        hot_groups: []
        alert_reasons: []
        resource_monitor_output: "API call failed – no output available"

    # -------------------------------------------------------------------------
    # Query the PAN-OS XML API for 'show running resource-monitor'.
    # Same handling as PA_ram.yml: key in the header, no_log, ignore_errors so an
    # alert email can still be sent when the call fails.
    # -------------------------------------------------------------------------
    - name: Call PAN-OS XML API – show running resource-monitor
      uri:
        url: "https://{{ inventory_hostname }}/api/"
        method: POST
        validate_certs: false
        headers:
          X-PAN-KEY: "{{ panos_api_key }}"
        body_format: form-urlencoded
        body:
          type: "op"
          cmd: "<show><running><resource-monitor/></running></show>"
        return_content: true
        status_code: [200]
      register: api_response
      ignore_errors: true
      no_log: true

    # PAN-OS can also answer HTTP 200 with status="error", so check the body too.
    - name: Record API failure and arm alert
      set_fact:
        api_failed: true
        alert_triggered: true
        alert_reasons: >-
          {{ alert_reasons + ['PAN-OS XML API call failed: ' ~
             (api_response.msg | default(api_response.status | string | default('unknown error')))] }}
      when: >
        api_response.failed or
        (api_response.status | default(0) | int) != 200 or
        (api_response.content | default('')) is not search('status=.success')

    - name: Keep raw API output
      set_fact:
        resource_monitor_output: "{{ api_response.content }}"
      when: not api_failed

    # -------------------------------------------------------------------------
    # <second><task><flow_lookup>70%</flow_lookup> ... </task>
    # The per-minute/hour/day/week sections only have an empty <task/>, so the first
    # non-empty <task>...</task> is the per-second group block.
    # -------------------------------------------------------------------------
    - name: Parse CPU load sampling by group
      set_fact:
        group_pairs: >-
          {{ (api_response.content | regex_search('(?s)<task>.*?</task>') | default('', true))
             | regex_findall('<([a-z_]+)>([0-9]+)%</\1>') }}
      when: not api_failed

    - name: Record parse failure and arm alert
      set_fact:
        parse_failed: true
        alert_triggered: true
        alert_reasons: "{{ alert_reasons + ['CPU load sampling by group not found in the output (check the saved file on SFTP)'] }}"
      when:
        - not api_failed
        - group_pairs | length == 0

    - name: Debug parsed group values
      debug:
        msg: "{{ group_pairs | map('join', '=') | list }}"

    - name: Evaluate group threshold
      set_fact:
        hot_groups: >-
          {{ group_pairs | map('first') | zip(group_pairs | map('last') | map('int'))
             | selectattr('1', 'gt', cpu_group_threshold | int) | list }}
      when: group_pairs | length > 0

    - name: Arm alert when a group is over the threshold
      set_fact:
        alert_triggered: true
        alert_reasons: "{{ alert_reasons + ['CPU load sampling by group above ' ~ cpu_group_threshold ~ '%: ' ~ (hot_groups | map('join', ' ') | join(', '))] }}"
      when: hot_groups | length > 0

    # =========================================================================
    # Alert email
    # Sent BEFORE the SFTP upload, so an SFTP outage cannot suppress the alert.
    # All SMTP/address parameters come from AWX variables – nothing is hardcoded.
    # =========================================================================
    - name: Define output filename
      set_fact:
        filename: "{{ ansible_network_hostname }}-{{ ha_state }}-DPCPU-{{ timestamp_sec }}.txt"

    - name: Send alert email when a group is over the threshold or API call failed
      mail:
        host: "{{ alert_smtp_host }}"
        from: "{{ alert_email_from }}"
        to: "{{ alert_email_to }}"
        subject: "PAN-OS Data Plane CPU Alert - {{ ansible_network_hostname }}"
        body: |
          ============================================================
          PAN-OS DATA PLANE CPU ALERT
          ============================================================
          Firewall       : {{ inventory_hostname }}
          Timestamp Day  : {{ timestamp_day }}
          Timestamp Sec  : {{ timestamp_sec }}
          Role:          : {{ ha_state }}
          Threshold      : any group above {{ cpu_group_threshold }}%
          ============================================================
          ALERT DETAILS:
          ============================================================
          API Failed     : {{ api_failed }}
          Parse Failed   : {{ parse_failed }}
          {% for r in alert_reasons %}
          - {{ r }}
          {% endfor %}

          ============================================================
          CPU load sampling by group:
          ============================================================
          {% for g in group_pairs %}
          {{ '%-30s' | format(g[0]) }}: {{ '%4s' | format(g[1] ~ '%') }}{{ '   <-- OVER THRESHOLD' if g[1] | int > cpu_group_threshold | int else '' }}
          {% endfor %}

          Full output on SFTP: {{ sftp_path }}/{{ timestamp_day }}/{{ filename }}
      when: alert_triggered | bool

    # -------------------------------------------------------------------------
    # Save the whole output as a .txt file and upload it (same flow as PA_ram.yml).
    # -------------------------------------------------------------------------
    - name: Write raw API output to file
      copy:
        content: "{{ resource_monitor_output }}"
        dest: "/tmp/tmpfiles/{{ filename }}"

    - import_tasks: tasks/t_sftp.yml
    - import_tasks: tasks/t_upload.yml
    - import_tasks: tasks/t_delete_file.yml

debug dataplane pow performance all | match pbp
debug dataplane pow performance all
show running resource-monitor ingress-backlogs
show counter global filter delta yes
show running resource-monitor second last 10
show session packet-buffer-protection
show counter global filter delta yes
show session info
show session all filter count yes
